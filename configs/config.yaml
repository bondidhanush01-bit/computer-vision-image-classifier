"""
Configuration management for the computer vision project
"""

model:
  architecture: resnet50
  num_classes: 10
  pretrained: true
  input_size: 224
  
training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 0.0001
  momentum: 0.9
  scheduler: cosine
  early_stopping_patience: 10
  
data:
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  num_workers: 4
  pin_memory: true
  
preprocessing:
  normalize: true
  augmentation: true
  augmentation_params:
    rotation: 15
    translation: 0.1
    scale: 0.1
    brightness: 0.2
    contrast: 0.2
    
inference:
  confidence_threshold: 0.5
  nms_threshold: 0.4
  max_detections: 100
  
device:
  use_cuda: true
  cuda_devices: [0]
  
paths:
  data_root: ./data
  models_root: ./models
  logs_root: ./logs
  checkpoints_root: ./checkpoints
  
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
